name: pester

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Pester (Windows, no elevation)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The Sensitivity-Gate tests shell out to `python guest/screener.py`, so the
      # runner needs Python on PATH. (Phase 0 introduced the first Python to the repo.)
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Install Pester 5
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser
          # windows-latest ships Pester 3.4.0 machine-wide; import explicitly so the v5
          # configuration API below cannot bind against the old module.
          Import-Module Pester -MinimumVersion 5.5.0 -Force
          (Get-Module Pester).Version

      - name: Run the suite (mockable backend — no Hyper-V / no admin needed)
        shell: pwsh
        run: |
          $c = New-PesterConfiguration
          $c.Run.Path = 'tests'
          $c.Run.PassThru = $true
          $c.Output.Verbosity = 'Detailed'
          $c.Run.Exit = $true          # non-zero exit on any failure -> fails the job
          Invoke-Pester -Configuration $c

      - name: Run the Python suite (guest screener + outbox + host reader)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest tests/guest tests/host -q
